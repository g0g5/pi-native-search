# Search backends implemented by this extension (documentation only).
#
# The runtime source of truth is SEARCH_BACKENDS in
# extensions/search-providers.ts. This file is not read at runtime; it exists so
# the backend set, capability kind, and authentication mode are documented next
# to the fork notes. tests/providers-doc.test.ts compares this file with the
# runtime registry, so keep them in sync.
#
# kind: llm      -> invokes a provider LLM and requires a registered model when
#                   pinned as the global target.
# kind: non-llm  -> invokes no LLM and never requires a model.
#
# auth: api-key           -> environment variable or Pi auth.json api_key entry
#       pi-oauth          -> Pi's OAuth credentials for a registered model
#       cli-subscription  -> the `claude` CLI's own subscription login
#       none              -> no credentials
#
# Providers without an implemented search adapter (DeepSeek, OpenRouter, Mistral,
# Groq, and so on) are intentionally absent: they remain valid conversation
# providers but are not selectable search backends.

backends:
  google:
    name: Google Gemini
    kind: llm
    auth: api-key
    env_key: GEMINI_API_KEY
  openai:
    name: OpenAI
    kind: llm
    auth: api-key
    env_key: OPENAI_API_KEY
  openai-codex:
    name: OpenAI ChatGPT (subscription)
    kind: llm
    auth: pi-oauth
  xai:
    name: xAI (Grok)
    kind: llm
    auth: api-key
    env_key: XAI_API_KEY
  anthropic:
    name: Anthropic
    kind: llm
    auth: api-key
    env_key: ANTHROPIC_API_KEY
  claude-bridge:
    name: Claude Code (subscription)
    kind: llm
    auth: cli-subscription
  zai:
    name: ZAI Web Search MCP (GLM)
    kind: non-llm
    auth: api-key
    env_key: ZAI_API_KEY
  duckduckgo:
    name: DuckDuckGo
    kind: non-llm
    auth: none
